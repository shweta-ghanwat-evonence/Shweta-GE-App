# Calls the release-notes-orchestrator Application Integration flow directly
# via its execute API, authenticated through Workload Identity Federation -
# no stored secret at all (see docs/decisions.md in the LowCodeAgent repo,
# 2026-09-30 entries, for the full setup and the invocation format this was
# confirmed against via live testing).
#
# Needs no GitHub write permission - only forwards data GitHub already put
# in the event payload. The GitHub write (creating the tag and the Release)
# happens inside the orchestrator, using a separate, narrower credential
# (a fine-grained PAT), never this workflow's own token.

name: Release notes (auto)

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  release-notes:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/238017122334/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: '238017122334-compute@developer.gserviceaccount.com'

      - name: Call the release notes orchestrator
        env:
          PR_JSON: ${{ toJson(github.event.pull_request) }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg pr "$PR_JSON" \
            '{
              triggerId: "api_trigger/release-notes-orchestrator_API_1",
              inputParameters: {
                repo: { stringValue: $repo },
                pull_request: { jsonValue: $pr }
              }
            }')
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://us-central1-integrations.googleapis.com/v1/projects/project-4-workndemos/locations/us-central1/integrations/release-notes-orchestrator:execute" \
            -d "$payload"
